[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warvex"
version = "1.0.0"
description = "Self-hosted dashboard for a Raspberry Pi Cloudflare WARP gateway: tunnel status, connected clients, and service controls."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OneByJorah", email = "info@jorahone.com"}]
keywords = ["gateway", "cloudflare-warp", "raspberry-pi", "dashboard", "docker", "self-hosted", "jorahone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
]
requires-python = ">=3.11"
dependencies = ["flask>=3.0", "flask-socketio>=5.3", "gunicorn>=21.2", "eventlet>=0.35"]

[project.scripts]
warvex = "dashboard:main"

[project.urls]
Homepage = "https://github.com/OneByJorah/warvex"
Repository = "https://github.com/OneByJorah/warvex"
Issues = "https://github.com/OneByJorah/warvex/issues"

[tool.setuptools]
py-modules = ["dashboard"]
