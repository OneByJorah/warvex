services:
  warvex-dashboard:
    build: .
    image: ghcr.io/onebyjorah/warvex:latest
    container_name: warvex-dashboard
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    environment:
      - DASHBOARD_PORT=8080
      - DEMO_MODE=${DEMO_MODE:-false}
      - AP_SUBNET=${AP_SUBNET:-192.168.50.0/24}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - warvex-net

networks:
  warvex-net:
    driver: bridge
